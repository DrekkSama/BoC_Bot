# Check `ares-sc2/src/ares/config.yml` for valid config options
# Use this to override those values
# Can add own unique config options here if desired

# Set custom values here for your bot
MyBotName: Holdfast
MyBotRace: Zerg
# Local opponent: name from run.py LOCAL_OPPONENTS registry (e.g. ZergTestBot)
# empty -> random Computer (AI) opponent
OpponentBot: ZergTestBot
# Game patch for the local opponent's rush build:
#   Current      -> pre-5.0.16, 12 starting workers ("12_pool_zerg_rush")
#   5.0.16       -> 8 starting workers ("8_pool_zerg_rush")
Patch: Current
# Maps for local runs: one chosen at random each run.
# empty -> auto-discover all .SC2Map files in MAPS_PATH
Maps:
    #- UltraloveAIE_v2
    # - PylonAIE_v4
    # - PersephoneAIE_v4
    # - TorchesAIE_v4
    # - IncorporealAIE_v4
    # - MagannathaAIE_v2
     - UltraloveAIE_5.0.16_v2
    #### Micro Maps
    # - Tier1MicroAIArena_v6
    # - Tier2MicroAIArena_v6
# setting true allows auto upload to aiareana (https://aiarena.net/) on push to `main` branch
# see tutorial on readme before setting to True
AutoUploadToAiarena: False
BotZipPubliclyDownloadable: False
BotDataPubliclyDownloadable: False
BotDataEnabled: True
########################

UseData: False
Debug: False
GameStep: 2
DebugGameStep: 2

# Turn ares features on/off for performance reasons
Features:
    # this grid is useful for disruptor balls and maybe some other uses
    # off by default to save computation
    TacticalGroundGrid: False

DebugOptions:
    # one of: Air, AirVsGround, Ground, GroundAvoidance, AirAvoidance
    ActiveGrid: TacticalGround
    ChatDebug: True
    DebugSpawn: False
    ShowPathingCost: True
    ResourceDebug: False
    ShowBuildingFormation: False
