# Save the game opening and result to disk?
# Setting to `True` allows Ares to select a new opening after defeat
UseData: True
# How should we choose a build?
# Use `Cycle` for a simple build cycle on defeat
# Use `WinrateBased` to use winrates to select a build
BuildSelection: WinrateBased
# For each Race / Opponent ID choose a build selection
BuildChoices:
    # test_123 is active if Debug: True (set via a `config.yml` file)
    test_123:
        BotName: Test
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Protoss:
        BotName: ProtossRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Random:
        BotName: RandomRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Terran:
        BotName: TerranRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Zerg:
        BotName: ZergRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Lambo_ZvZ_Economic
            #- Pig_Hatch_Firs_5.0.16

    # Can also use specific opponent ids (overrides race options above)
    a_bot_opponent_id_from_aiarena:
        BotName: QueenBot
        Cycle:
            - B2GM_Roach_Ravager_Ling

Builds:
    B2GM_Roach_Ravager_Ling:
        ConstantWorkerProductionTill: 44
        ShouldHandleGasSteal: False
        AutoSupplyAtSupply: 28
        OpeningBuildOrder:
            - 12 overlord
            - 12 overlord_scout:
                  [enemy_nat_vision, enemy_nat_hg_spot]
            - 15 spawningpool
            - 15 hatchery
            - 15 overlord
            - 15 queen
            - 16 gas
            - 17 queen
            - 21 overlord
            - 24 Zergling x5
            - 25 ZERGLINGMOVEMENTSPEED
            - 25 hatchery
            - 25 BanelingNest
            - 28 overlord
            - 30 zergling x4
            - 34 ROACHWARREN
            - 35 gas
            - 35 lair
            - 35 queen
            - 35 gas x2
            - 40 evolutionchamber
            - 46 roach x5

    # Lambo ZvZ Economic — workers fully scripted (till 0). https://lotv.spawningtool.com/build/199749/
    # Pre-5.0.16 patch: 12 starting workers (used 12, cap 17).
    # Transcribed from ST: order+pauses from the build; gates re-derived
    # for sequential runner (ST supply numbers assume eggs hatching
    # mid-sequence — unreachable here). Banks: 300 nat (0:47), 200 pool
    # (1:13), 150x2 queens (1:59), 300 third (2:39). Lings strictly
    # after both queens. Ends at roach warren (ST 3:45); post-build
    # MacroManager.BuildWorkers resumes droning.
    Lambo_ZvZ_Economic:
        ConstantWorkerProductionTill: 0
        ShouldHandleGasSteal: False
        AutoSupplyAtSupply: 44
        OpeningBuildOrder:
            # ST: 12 drone, 13 OL scouts their 3rd
            - 12 worker
            - 12 overlord
            - 13 overlord_scout:
                  [enemy_third]
            # ST: 13 drone, 14 drone x2 -> 16 workers
            - 13 worker
            - 14 worker x2
            # ST: 16 hatch (0:47) — bank 300, drone consumed
            - 16 hatchery
            # ST: 15 drone x2 (0:51), 17 drone (0:57)
            - 15 worker x2
            - 17 worker
            # ST: 18 extractor (1:08), 17 pool (1:13) — bank 200
            - 18 extractor
            - 17 spawningpool
            # ST: 17 drone x2 (1:15), 18 drone (1:28) -> 19 workers
            - 16 worker x2
            - 18 worker
            # ST: 19 overlord (1:40)
            - 19 overlord
            # ST: 19 queen x2 (1:59) — bank 150 x2, nothing between
            - 19 queen
            - 21 queen
            # ST: 2:00 zergling x6 (x3 steps, +1 supply each), 2:10 speed
            - 23 zergling x3
            - 26 ZERGLINGMOVEMENTSPEED
            # ST: 30 hatch (2:39) — bank 300 for third, no drones between
            - 24 hatchery
            # ST: 32 baneling nest, OL; 36 safety lings x6
            - 23 banelingnest
            - 24 overlord
            - 24 zergling x3
            # ST: 40 OL, 41 extractor, 41 queen, 42 banelings, 44 warren
            - 26 overlord
            - 26 extractor
            - 26 queen
            - 28 baneling x2
            - 28 roachwarren

    # Pig's Hatch First (5.0.16) — workers fully scripted (till 0).
    # Pauses are omissions: bank 300 for natural (12), 150x2 for first
    # queens (18), 300 for third base (33). Tech steps interleave with
    # drone waves; AutoSupply (from 24) keeps overlords flowing.
    # Post-build, MacroManager.BuildWorkers resumes droning to 66+.
    Pig_Hatch_Firs_5.0.16:
        ConstantWorkerProductionTill: 0
        ShouldHandleGasSteal: False
        AutoSupplyAtSupply: 24
        OpeningBuildOrder:
            - 8 overlord_scout:
                  [enemy_ramp]
            # ladder to 12 workers
            - 8 worker
            - 9 worker
            - 10 worker
            - 11 worker
            # bank 300 for natural
            - 11 hatchery
            - 11 worker
            - 11 spawningpool
            - 11 worker
            - 11 overlord
            # larva-paced ladder to 18 workers
            - 10 worker x4
            # bank 150 x2 for the first two queens
            - 16 queen @nat
            - 16 worker x2
            - 16 queen
            - 18 overlord
            - 18 zergling @nat
            - 18 zergling @nat
            - 18 queen
            # resume droning, tech interleaved
            - 18 worker x6
            - 18 extractor x2
            - 18 worker x3
            - 18 roachwarren
            # bank 300 for third base
            - 20 hatchery
