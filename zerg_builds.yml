# Save the game opening and result to disk?
# Setting to `True` allows Ares to select a new opening after defeat
UseData: True
# How should we choose a build?
# Use `Cycle` for a simple build cycle on defeat
# Use `WinrateBased` to use winrates to select a build
BuildSelection: WinrateBased
# For each Race / Opponent ID choose a build selection
BuildChoices:
    # test_123 is active if Debug: True (set via a `config.yml` file)
    test_123:
        BotName: Test
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Protoss:
        BotName: ProtossRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Random:
        BotName: RandomRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Terran:
        BotName: TerranRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            - Pig_Hatch_Firs_5.0.16

    Zerg:
        BotName: ZergRace
        Cycle:
            #- B2GM_Roach_Ravager_Ling
            #- Lambo_ZvZ_Economic
            - Pig_Hatch_Firs_5.0.16

    # Can also use specific opponent ids (overrides race options above)
    a_bot_opponent_id_from_aiarena:
        BotName: QueenBot
        Cycle:
            - B2GM_Roach_Ravager_Ling

Builds:
    B2GM_Roach_Ravager_Ling:
        ConstantWorkerProductionTill: 44
        ShouldHandleGasSteal: False
        AutoSupplyAtSupply: 28
        OpeningBuildOrder:
            - 12 overlord
            - 12 overlord_scout:
                  [enemy_nat_vision, enemy_nat_hg_spot]
            - 15 spawningpool
            - 15 hatchery
            - 15 overlord
            - 15 queen
            - 16 gas
            - 17 queen
            - 21 overlord
            - 24 Zergling x5
            - 25 ZERGLINGMOVEMENTSPEED
            - 25 hatchery
            - 25 BanelingNest
            - 28 overlord
            - 30 zergling x4
            - 34 ROACHWARREN
            - 35 gas
            - 35 lair
            - 35 queen
            - 35 gas x2
            - 40 evolutionchamber
            - 46 roach x5

    Lambo_ZvZ_Economic:
        ConstantWorkerProductionTill: 44
        ShouldHandleGasSteal: False
        AutoSupplyAtSupply: 28
        OpeningBuildOrder:
            - 13 overlord
            - 13 overlord_scout:
                  [enemy_ramp]
            - 16 hatchery
            - 18 extractor
            - 17 spawningpool
            - 21 overlord
            - 21 queen
            - 21 queen
            - 26 ZERGLINGMOVEMENTSPEED
            - 29 zergling x4
            - 31 hatchery
            - 30 banelingnest
            - 33 overlord
            - 33 zergling x8
            - 36 queen
            - 39 baneling x2
            - 42 overlord
            - 44 evolutionchamber
            - 47 overlord

    # Pig's Hatch First (5.0.16) — workers fully scripted (till 0).
    # Pauses are omissions: bank 300 for natural (12), 150x2 for first
    # queens (18), 300 for third base (33). Tech steps interleave with
    # drone waves; AutoSupply (from 24) keeps overlords flowing.
    # Post-build, MacroManager.BuildWorkers resumes droning to 66+.
    Pig_Hatch_Firs_5.0.16:
        ConstantWorkerProductionTill: 0
        ShouldHandleGasSteal: False
        AutoSupplyAtSupply: 24
        OpeningBuildOrder:
            - 8 overlord_scout:
                  [enemy_ramp]
            # ladder to 12 workers
            - 8 worker
            - 9 worker
            - 10 worker
            - 11 worker
            # bank 300 for natural
            - 11 hatchery
            - 11 worker
            - 11 spawningpool
            - 11 worker
            - 11 overlord
            # larva-paced ladder to 18 workers
            - 10 worker x4
            # bank 150 x2 for the first two queens
            - 16 queen @nat
            - 16 worker x2
            - 16 queen
            - 18 overlord
            - 18 zergling @nat
            - 18 zergling @nat
            - 20 queen
            # resume droning, tech interleaved
            - 20 worker x6
            - 29 extractor x2
            - 29 worker x3
            - 30 roachwarren
            - 32 worker
            # bank 300 for third base
            - 33 hatchery
            - 32 worker x8
            - 40 ZERGLINGMOVEMENTSPEED
            - 40 roach x5
        
